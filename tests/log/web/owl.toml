[project]
name = "avenys-log-web"
version = "0.1.0"
entry = "src/server.mire"

[build]
compiler = "mire"
profile = "release"
opt-level = "3"

[paths]
sources = "src"
tests = "tests"
output = "bin"
cache = "bin/.cache"

[dependencies]
kioto = { path = "../../../../kioto" }
sqlite = { path = "../../../../sqlite" }

[c]
runtime = "full"
libs = ["sqlite3"]
sources = ["../../../../sqlite/native/sqlite_bridge.c"]
cflags = [
  "-Wl,-rpath,$ORIGIN/../../../../libs/kioto",
  "-Wl,-rpath,$ORIGIN/../../../../libs/mire",
  "-Wl,-rpath,$ORIGIN/../../../../libs/sqlite"
]
