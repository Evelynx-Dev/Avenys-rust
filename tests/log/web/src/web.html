<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avenys test logs</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 15px system-ui; background: #10141c; color: #e8edf5; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    pre { background: #1b2330; padding: 1rem; border-radius: 8px; overflow: auto; }
    .ok { color: #66e3a5; }
  </style>
</head>
<body>
  <h1>Avenys live test logs</h1>
  <p class="ok" id="status">connecting...</p>
  <pre id="log">loading...</pre>
  <script>
    const out = document.querySelector('#log');
    const status = document.querySelector('#status');
    async function refresh() {
      const response = await fetch('/api/logs', { cache: 'no-store' });
      out.textContent = JSON.stringify(await response.json(), null, 2);
    }
    refresh();
    setInterval(refresh, 1000);
    const ws = new WebSocket('ws://' + location.host + '/ws');
    ws.onopen = () => status.textContent = 'websocket connected';
    ws.onmessage = () => refresh();
    ws.onclose = () => status.textContent = 'websocket snapshot complete';
  </script>
</body>
</html>
