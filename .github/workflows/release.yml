name: Release

on:
  push:
    tags:
      - "v*"
      - "B*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Avenys-rust
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget ca-certificates pkg-config libsodium-dev zlib1g-dev libzstd-dev libarchive-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Checkout kioto (up-to-date Evelynx-Dev fork, v2.4.7)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/Kioto-1
          path: kioto
          ref: master

      - name: Checkout mire stdlib (mire-lang/mire-lib)
        uses: actions/checkout@v4
        with:
          repository: mire-lang/mire-lib
          path: mire
          ref: main

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build mire binary
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo build --release

      - name: Install mire so owl can use it
        run: |
          sudo cp target/release/mire /usr/local/bin/mire
          sudo chmod +x /usr/local/bin/mire
          mire --version

      - name: Checkout owl source (up-to-date Evelynx-Dev fork, PR #14)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/owl
          path: owl-src
          ref: pr-0.27.0

      - name: Setup owl dependencies
        run: |
          mkdir -p ~/.owl/modules
          cp -r kioto ~/.owl/modules/kioto
          # owl-src/owl.toml hardcodes a local kioto path; repoint to the
          # sibling checkout so `load kioto` resolves. kioto owl.toml then
          # resolves `mire` at its neighbor ../mire (the mire-lib checkout).
          sed -i 's|"/home/Evelyn/.owl/libs/kioto"|"../kioto"|' owl-src/owl.toml

      - name: Build owl
        working-directory: owl-src
        run: mire build code/main.mire --release -O3 --no-analysis-cache

      - name: Verify owl
        working-directory: owl-src
        run: |
          chmod +x bin/release/main
          ./bin/release/main -V

      - name: Prepare owl tarball
        run: |
          mkdir -p dist/owl
          cp owl-src/bin/release/main dist/owl/owl
          cp -r kioto dist/owl/kioto
          cd dist
          tar czf ../owl-linux-x86_64.tar.gz owl/

      - name: Prepare compiler tarball
        run: |
          mkdir -p dist/compiler
          cp target/release/mire dist/compiler/mire
          cp -r src/runtime dist/compiler/runtime
          cp -r src/pal dist/compiler/pal
          cd dist
          tar czf ../mire-compiler-linux-x86_64.tar.gz compiler/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Build ${{ github.ref_name }}"
          body_path: README.md
          files: |
            owl-linux-x86_64.tar.gz
            mire-compiler-linux-x86_64.tar.gz
