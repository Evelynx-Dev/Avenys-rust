name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget ca-certificates pkg-config libsodium-dev zlib1g-dev libzstd-dev libarchive-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Checkout kioto (Shukensha-sys fork, master = v2.4.9 namespaced net API)
        uses: actions/checkout@v4
        with:
          repository: Shukensha-sys/Kioto
          path: kioto-src
          ref: master

      - name: Setup kioto for tests
        run: cp -r kioto-src ../kioto

      - name: Checkout mire stdlib (Shukensha-sys/mire-lib = local Arch/mire, incl. assert macro)
        uses: actions/checkout@v4
        with:
          repository: Shukensha-sys/mire-lib
          path: mire-src
          ref: main

      - name: Setup mire stdlib for tests
        run: cp -r mire-src ../mire

      - name: Shim libsodium soname for prebuilt test fixtures
        run: |
          # tests/libs/{mire,kioto}/*.so (GNU/Linux, built against libsodium
          # 1.0.20) record a libsodium.so.26 NEEDED entry; ubuntu-24.04 ships
          # libsodium.so.23. The symbols they exercise (sodium_init,
          # crypto_sign_*) are stable public ABI, so alias the available
          # library under the recorded soname for the linker and the loader.
          SOD=$(find /usr/lib -name 'libsodium.so.23' | head -1)
          if [ -n "$SOD" ]; then
            sudo ln -sfn "$SOD" "${SOD%.23}.26"
            ls -l "${SOD%.23}.26"
          else
            echo "warning: libsodium.so.23 not found; fixtures may fail to link"
          fi

      - name: Build
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo build --release

      - name: Test
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: cargo test --release

      - name: Run modular Mire tests
        env:
          LLVM_CONFIG_PATH: /usr/bin/llvm-config-22
        run: |
          rm -rf "$HOME/.owl/libs" /tmp/avenys-tests-cache
          mkdir -p "$HOME/.owl/libs"
          cp -a kioto-src "$HOME/.owl/libs/kioto"
          cp -a mire-src "$HOME/.owl/libs/mire"
          ./target/release/mire test tests -j 8 --release --log \
            --lib-dir "$HOME/.owl/libs" --cache-dir /tmp/avenys-tests-cache

      - name: Prepare artifact
        run: |
          mkdir -p dist/mire
          cp target/release/mire dist/mire/
          cp -r src/runtime dist/mire/runtime
          cp -r src/pal dist/mire/pal

      - name: Upload mire artifact
        uses: actions/upload-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire/
          retention-days: 7

  build-owl:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget ca-certificates pkg-config libsodium-dev zlib1g-dev libzstd-dev libarchive-dev
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Download mire artifact
        uses: actions/download-artifact@v4
        with:
          name: mire-linux-x86_64
          path: dist/mire

      - name: Install mire and runtime
        run: |
          chmod +x dist/mire/mire
          sudo cp dist/mire/mire /usr/local/bin/mire
          sudo mkdir -p /usr/local/lib/mire
          if [ -d dist/mire/runtime ]; then
            sudo cp -r dist/mire/runtime /usr/local/lib/mire/
          fi
          if [ -d dist/mire/pal ]; then
            sudo cp -r dist/mire/pal /usr/local/lib/mire/
          fi
          mire --version || echo "mire installed"

      - name: Checkout kioto (Shukensha-sys fork, master = v2.4.9 namespaced net API)
        uses: actions/checkout@v4
        with:
          repository: Shukensha-sys/Kioto
          path: kioto-src
          ref: master

      - name: Checkout owl source (up-to-date Evelynx-Dev fork, PR #14 = migrated namespaced API)
        uses: actions/checkout@v4
        with:
          repository: Evelynx-Dev/owl
          path: owl-src
          ref: pr-0.27.0

      - name: Checkout mire stdlib (Shukensha-sys/mire-lib, incl. assert macro)
        uses: actions/checkout@v4
        with:
          repository: Shukensha-sys/mire-lib
          path: mire
          ref: main

      - name: Setup owl dependencies
        run: |
          mkdir -p ~/.owl/modules ~/.owl/libs
          cp -r kioto-src ~/.owl/modules/kioto
          cp -a kioto-src ~/.owl/libs/kioto
          cp -a mire ~/.owl/libs/mire
          cp -r kioto-src ./kioto
          # owl-src/owl.toml deps kioto via ~/.owl/libs/kioto (or, on older
          # forks, Evelyn's absolute path); the runner's ~/.owl/libs is now
          # populated above, and the absolute path (if present) is repointed
          # to the sibling checkout so `load kioto` resolves in CI.
          sed -i -e 's|"/home/Evelyn/.owl/libs/kioto"|"../kioto"|' owl-src/owl.toml

      - name: Generate avenys config for the owl build
        run: |
          cat > owl-src/native/mire-config.toml <<'EOF'
          [project]
          name = "owl"
          version = "1.1.1"
          entry = "code/main.mire"

          [build]
          profile = "release"
          opt-level = 3
          artifact = "bin"
          runtime = "minimal"
          target = "x86_64-unknown-linux-gnu"

          [paths]
          bin = "${{ github.workspace }}/owl-src/bin"
          cache = "/tmp/owl-archive-cache"

          [cfg]
          libs = ["archive"]
          sources = ["native/archive.c"]
          link-dirs = []
          cflags = ["-Wl,--disable-new-dtags", "-Wl,-rpath,$ORIGIN/../lib/mire"]
          EOF

      - name: Build owl
        working-directory: owl-src
        run: |
          mire build code/main.mire --release -O3 --no-analysis-cache --config native/mire-config.toml

      - name: Test owl
        working-directory: owl-src
        run: |
          chmod +x bin/release/main
          ./bin/release/main -V
          echo "owl build successful"

      - name: Upload owl artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-linux-x86_64
          path: owl-src/bin/release/main
          retention-days: 7
